# @package _global_
model_size: tiny
encoder:
  _target_: tactile_ssl.model.CrossSensorTransformer
  embed_dim: 192
  in_dim: 368 # total number of xela sensors in hand
  in_chans: 30 # 3 xela mag channels + 3 position channels
  sequence_length: 1 # max sequence length
  time_chunk_size: 1 # max time_chunk_size
  num_register_tokens: 1
  pos_embed_fn: learned
  with_masktoken: True
  drop_path_rate: 0.3
  drop_path_uniform: True
  normalization: 
  causal: False
