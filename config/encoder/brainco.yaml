# @package _global_
model_size: tiny
encoder:
  _target_: tactile_ssl.model.brainco_${model_size}
  in_dim: 10 # total number of brainco sensors per hand (thumb to pinky, 5 per hand, 2 hands)
  in_chans: 4 # 4 channels for brainco
  sequence_length: 1
  time_chunk_size: 1
  num_register_tokens: 1
  pos_embed_fn: learned
  with_masktoken: True
  drop_path_rate: 0.3
  drop_path_uniform: True
  normalization:
    mean: [0.0, 0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0, 1.0]
  causal: False
