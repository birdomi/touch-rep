train_dataloader:
  batch_size: 512
  num_workers: 32
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true

normalization:
  mean: null   # populated at runtime by get_dataloaders_all_vector_based()
  std: null

sensor: all_vector

oakinkv2_data_root: pretraining_dataset/vector_dataset/OAKINKV2
arctic_data_root: pretraining_dataset/vector_dataset/ARCTIC
taco_data_root: pretraining_dataset/vector_dataset/TACO
hot3d_data_root: pretraining_dataset/vector_dataset/HOT3D/hot3d
window_size: 1
window_stride: 1
train_val_split: 1.0
# Restrict the sensor stream to the 10 fingertip joints (FINGERTIP_COLUMNS),
# matching the BrainCo downstream sensor layout, instead of all 42 joints.
fingertip_only: false
# Subset of FORCE_CHANNELS names to keep as input channels (null = all four).
# e.g. ["proximity"] trains on proximity alone; encoder.in_chans must match.
sensor_channels: null

# Data-scaling study: keep this fraction of the *training* files, per corpus, so
# the domain mix is preserved. The order is shuffled once with data_fraction_seed
# and sliced from the front, so subsets nest (1% inside 2% inside 5% ...) and the
# curve measures added data rather than a different draw at every point.
# null = use everything.
data_fraction: null
data_fraction_seed: 1234
