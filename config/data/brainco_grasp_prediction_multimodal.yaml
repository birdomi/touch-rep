train_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: False
  drop_last: False
  pin_memory: True
  persistent_workers: True

sensor: brainco_grasp_multimodal
train_data_budget: 1.0
val_data_budget: 1.0

window_time: 0.1
window_overlap: 0.5
interpolating_freq: 100

num_frames_per_sample: 4
img_size: 224

dataset:
  _target_: tactile_ssl.data.brainco_grasp_multimodal_dataset.BraincoGraspMultimodalDataset
  config:
    window_time: ${data.window_time}
    window_overlap: ${data.window_overlap}
    interpolating_freq: ${data.interpolating_freq}
    subtract_baseline: False
    smooth_data: False
    bias_noise_std: 0
    bias_range: 0
  data_path: ${paths.data_root}/brainco/downstream/grasp_prediction
  brainco_urdf_path: ${paths.data_root}/brainco/urdf/
  num_frames_per_sample: ${data.num_frames_per_sample}
  img_size: ${data.img_size}
