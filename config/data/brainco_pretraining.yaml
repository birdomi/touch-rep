train_dataloader:
  batch_size: 512
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

normalization:
  mean: null # This will be populated in train.py during data loading and stored in model state_dict
  std: null # This will be populated in train.py during data loading and stored in model state_dict
object_classes: null
object_class_weights: null

window_time: 0.01 # default 0.01 
window_overlap: 0.0
interpolating_freq: 100

sensor: brainco
dataset_list:
  - type: teleop
    sequence_list:
      - basket
      - box
      - doll
      - hammer
      - pot
      - towel
    train_dataset_ids: [0, 1, 2, 3, 4, 5, 7, 8, 9, 10, 11]
    val_dataset_ids: [0]

    dataset:
      _target_: tactile_ssl.data.brainco_tactile.BraincoSSLDataset
      config:
        window_time: ${data.window_time}
        window_overlap: ${data.window_overlap}
        interpolating_freq: ${data.interpolating_freq}
        subtract_baseline: True
        smooth_data: False
        bias_noise_std: 0
        bias_range: 0
      data_path: pretraining_dataset/brainco
      brainco_urdf_path: ${paths.data_root}/brainco/urdf/
      load_images: False
