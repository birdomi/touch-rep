train_dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  drop_last: false
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true

sensor: brainco_grasp_prediction_w15_vision
class_names:
  0: Fail
  1: Success
train_data_budget: 1.0
val_data_budget: 1.0
# Grasp success/fail is close to balanced; the tactile protocol samples plainly.
balanced_sampling: false

augment_train: false
img_size: 224
crop_mode: bottom_center
crop_size: 320
# The window holds 15 frames but only 3 images reach the network.
num_frames_per_sample: 3

# 15 frames at interpolating_freq 100, matching the tactile w15 grasp config
# (experiment/brainco/ours_3d/task/grasp_prediction/dinov2_all_rope_w15).
window_time: 0.15
window_overlap: 0.0
interpolating_freq: 100

dataset:
  _target_: tactile_ssl.data.brainco_grasp_vision_dataset.BraincoGraspVisionDataset
  config:
    window_time: ${data.window_time}
    window_overlap: ${data.window_overlap}
    interpolating_freq: ${data.interpolating_freq}
    crop_mode: ${data.crop_mode}
    crop_size: ${data.crop_size}
    # Enumerate windows exactly like BraincoSSLDataset so this run lines up
    # window-for-window with the tactile grasp runs (31-frame episodes -> 2).
    window_mode: tactile
    # 1-indexed picks inside the window: first, 5th and last frame.
    frame_positions: [1, 5, 15]
    data_roots:
      - data_path: ${paths.data_root}/brainco/downstream/grasp_prediction_0611
        label_dirs:
          box_succ: 1
          box_fail: 0
          tumbler_succ: 1
          tumbler_fail: 0
          eraser_succ: 1
          eraser_fail: 0
          driver_succ: 1
          driver_fail: 0
          case_succ: 1
          case_fail: 0
  data_path: ${paths.data_root}/brainco/downstream/grasp_prediction_0611
  num_frames_per_sample: ${data.num_frames_per_sample}
  img_size: ${data.img_size}

val_dataset: null
