train_dataloader:
  batch_size: 512
  num_workers: 8
  shuffle: true
  drop_last: true
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: false
  drop_last: false
  pin_memory: true
  persistent_workers: true

normalization:
  mean: null   # populated at runtime by get_dataloaders_hot3d_vector_based()
  std: null

sensor: hot3d_vector

data_root: pretraining_dataset/vectors/hot3d
window_size: 1
window_stride: 1
train_val_split: 1.0
