train_dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: True
  drop_last: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: False
  drop_last: False
  pin_memory: True
  persistent_workers: True

sensor: brainco_grasp_vision
train_data_budget: 1.0
val_data_budget: 1.0

window_time: 0.3
window_overlap: 0.0
interpolating_freq: 100

num_frames_per_sample: 4
img_size: 224
augment: false
crop_mode: bottom_center  # resize | bottom_center
crop_size: 320

dataset:
  _target_: tactile_ssl.data.brainco_grasp_vision_dataset.BraincoGraspVisionDataset
  config:
    window_time: ${data.window_time}
    window_overlap: ${data.window_overlap}
    interpolating_freq: ${data.interpolating_freq}
    crop_mode: ${data.crop_mode}
    crop_size: ${data.crop_size}
    data_roots:
      - data_path: ${paths.data_root}/brainco/downstream/grasp_prediction_0611
        label_dirs:
          box_succ: 1
          box_fail: 0
          tumbler_succ: 1
          tumbler_fail: 0
          eraser_succ: 1
          eraser_fail: 0
          driver_succ: 1
          driver_fail: 0
  data_path: ${paths.data_root}/brainco/downstream/grasp_prediction_0611
  num_frames_per_sample: ${data.num_frames_per_sample}
  img_size: ${data.img_size}
  augment: ${data.augment}

# Optional: set this to use a fixed validation dataset instead of k-fold
# splitting from `dataset`. Keep null for the existing k-fold behavior.
val_dataset: null
