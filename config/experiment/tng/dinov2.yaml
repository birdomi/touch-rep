# @package _global_
defaults:
  - override /data: tng
  - override /algorithm: tng_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_tng_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: tng_dinov2
  group: dino_xela${model_size}
  tags: ["xela${model_size}"]

trainer:
  max_epochs: 100
  validation_frequency: 5

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.xela_${model_size}
    input_type: "image"
    patch_size: 8
    in_dim: 64 # 8x8 patches
