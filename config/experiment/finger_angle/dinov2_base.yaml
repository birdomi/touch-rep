# @package _global_

defaults:
  - override /data: hot3d_vector
  - override /algorithm: finger_angle_dinov2
  - _self_

model_size: base
experiment_name: finger_angle_dinov2_hot3d_${model_size}
ckpt_path: ./

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: dinov2
  group: dino_hot3d_vectors_${model_size}
  tags: ["hot3d", "${model_size}"]

algorithm:
  encoder:
    _target_: tactile_ssl.model.finger_angle_base
    drop_path_rate: 0.4

trainer:
  max_epochs: 200
  validation_frequency: 50
