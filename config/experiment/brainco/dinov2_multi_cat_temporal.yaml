# @package _global_
# Multi-sensor Cat temporal pretraining (BrainCo only, T=5).
#
# Data:   brainco_temporal — window_time=0.05s → 5 frames/window (T=5 at 100 Hz)
# Model:  multi_sensor_brainco_cat_temporal_tiny with sequence_length=5
#           → tokenises (B, T=5, N=10, C=4) into 5×10=50 tokens
#           → captures intra-window temporal dynamics inside the encoder
#
# Differs from dinov2_multi_cat.yaml only in:
#   data:                            brainco_xela_multi → brainco_temporal
#   algorithm.encoder._target_:      multi_sensor_brainco_cat_tiny → multi_sensor_brainco_cat_temporal_tiny
#   algorithm.encoder.sequence_length: 1 → 5
defaults:
  - override /data: brainco_temporal
  - override /algorithm: multi_sensor_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_multi_sensor_cat_temporal_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: brainco_dinov2
  group: dino_multi_sensor_cat_temporal_${model_size}
  tags: ["multi_sensor", "brainco", "${model_size}", "concat_fusion", "temporal", "T5"]

trainer:
  max_epochs: 1000
  validation_frequency: 50

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.multi_sensor_brainco_cat_temporal_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 5      # T=5: encoder sees 5 consecutive frames at once
    time_chunk_size: 1
    xela_num_frames: 10
