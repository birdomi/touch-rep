# @package _global_
defaults:
  - override /data: brainco_grasp_prediction
  - override /task: multi_sensor_grasp_prediction
  - _self_

ssl_name: dinov2
sensor: brainco
experiment_name: grasp_prediction_multi_sensor
ckpt_path: ./

resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

fold: 0       # 0-indexed fold to use as validation set
num_folds: 4  # 5-fold → 80% train / 20% val by episode

data:
  dataset:
    _target_: tactile_ssl.data.brainco_grasp_dataset.BraincoGraspDetectionDataset
    use_skeleton_poses: true
    robot_to_human: true
    retargeting_config_path_left: assets/brainco/revo2_left_hand.yml
    retargeting_config_path_right: assets/brainco/revo2_right_hand.yml
task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_multi_sensor_pretrained/epoch-0050_both.ckpt 
  #${paths.encoder_checkpoint_root}/dinov2_multi_sensor_pretrained/epoch-0030_0413.ckpt
  train_encoder: true
  lora_rank: 0      # LoRA 활성화
  lora_alpha: 16.0  
  model_encoder:
    use_null_token: true
    in_dim: 42
  finetune_modules:
    ~
    # - sensor_block
    # - patch_embed
    # - pos_embed
