# @package _global_
defaults:
  - override /data: brainco_grasp
  - override /task: multi_sensor_grasp_detection
  - _self_

ssl_name: dinov2
sensor: brainco
experiment_name: grasp_detection_multi_sensor
ckpt_path: ./

resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

fold: 0       # 0-indexed fold to use as validation set
num_folds: 4  # 4-fold → 75% train / 25% val by episode

data:
  dataset:
    _target_: tactile_ssl.data.brainco_grasp_dataset.BraincoGraspDetectionDataset
    use_skeleton_poses: true
task:
  checkpoint_encoder: ~
  train_encoder: true
  model_encoder:
    in_dim: 42
  finetune_modules: ~
