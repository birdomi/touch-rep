# @package _global_

defaults:
  - override /data: taco
  - override /algorithm: gigahands_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_arctic_${model_size}
ckpt_path: ./

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: dinov2
  group: dino_oakinkv2_${model_size}
  tags: ["gigahands", "oakinkv2", "${model_size}"]

trainer:
  max_epochs: 300
  validation_frequency: 50

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.multi_sensor_tiny
    in_dim: 42              # 21 lh + 21 rh keypoints
    in_chans: 1             # contact channel only
    sequence_length: 3
    time_chunk_size: 3
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: True
    drop_path_rate: 0.3
    drop_path_uniform: True
    normalization: ${data.normalization}
    causal: False
