# @package _global_
# Temporal BrainCo pretraining: encoder processes T=5 consecutive frames jointly.
#
# Data:   window_time=0.05s → 5 frames/window (T=5 at 100 Hz)
# Model:  brainco_cat_tiny with sequence_length=5
#           → tokenises (B, T=5, N=10, C=4) into 5×10=50 tokens
#           → captures intra-window temporal dynamics inside the encoder
#
# Differs from dinov2_cat.yaml only in:
#   data.window_time:           0.01 → 0.05
#   algorithm.encoder.sequence_length: 1  → 5
defaults:
  - override /data: brainco_temporal
  - override /algorithm: brainco_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_brainco_cat_temporal_${model_size}
ckpt_path: ./

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: brainco_dinov2
  group: dino_brainco_cat_temporal_${model_size}
  tags: ["brainco", "${model_size}", "cat_temporal", "T5"]

trainer:
  max_epochs: 1000
  validation_frequency: 50

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.brainco_cat_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 5      # T=5: encoder sees 5 consecutive frames at once
    time_chunk_size: 1
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: True
    drop_path_rate: 0.3
    drop_path_uniform: True
    normalization: ${data.normalization}
    causal: False
