# @package _global_

defaults:
  - override /data: brainco_grasp_prediction_combined
  - override /task: brainco_grasp_prediction
  - _self_

model_size: tiny
ssl_name: dinov2
sensor: brainco_uni_input
experiment_name: uni_input_grasp_prediction_combined_pretrained
ckpt_path: ./

resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

fold: 0
num_folds: 4

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: brainco_grasp_prediction
  group: uni_input_grasp_prediction_combined_pretrained
  tags: ["brainco", "uni_input", "grasp_prediction", "combined", "pretrained", "${model_size}"]

trainer:
  max_epochs: 100
  validation_frequency: 5

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_brainco_uni/epoch-5000.ckpt
  checkpoint_task: ~
  train_encoder: true
  encoder_type: dinov2

  model_encoder:
    _target_: tactile_ssl.model.brainco_one_${model_size}
    in_dim: 10
    in_chans: 4
    pos_in_chans: 3
    sequence_length: 1
    time_chunk_size: 1
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: true
    drop_path_rate: 0.0
    drop_path_uniform: true
    causal: false
