# @package _global_

# CLS-frames temporal stack with rebalanced depths:
#   temporal former   depth 2 -> 4   (back to the size that produced the
#                                     slip-best w15_prox + CLS readout result)
#   frame encoder     depth 8 -> 4   (AngleTransformer fusion blocks halved)
#
# Rationale: with frame_token_set=cls the former is the only place temporal
# reasoning happens, so capacity moves there; the frame encoder only needs to
# summarize one frame into one token, so its 8 fusion blocks are likely
# oversized. Total parameters stay close to the d2_cls variant.
#
# Inherited unchanged: proximity-only (in_chans 1), all 42 joints, CLS-frames
# former input, W=15, crop ranges, batch 2048, stride 5, lr, 100 epochs.
#
# Downstream evals must mirror BOTH depths (model_encoder.depth: 4 and
# model_encoder.frame_encoder.depth: 4) plus frame_token_set: cls, or
# load_encoder silently drops the mismatched blocks.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_prox_d2_cls
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "proximity_only", "42joint", "cls_frames", "former_d4",
         "frame_d4"]

algorithm:
  encoder:
    depth: 4
    frame_encoder:
      depth: 4
