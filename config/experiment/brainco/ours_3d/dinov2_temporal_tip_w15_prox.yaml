# @package _global_

# Proximity-only ablation of dinov2_temporal_tip_w15: the frame encoder sees
# just the proximity channel of the 10 fingertips (in_chans 1 instead of 4).
# Everything else -- W=15, crop ranges, former depth, batch 2048, lr, 100
# epochs -- is inherited unchanged.
#
# The frame-wise proximity-only run reached the best grasp result so far
# (macro F1 0.9149) with a randomly reinitialized 4-channel input projection at
# fine-tune time, which suggested the transformer body had learned channel
# independent structure. This asks whether that still holds once the temporal
# former is in the loop, i.e. whether contactless geometry alone carries enough
# signal for the temporal objective.
#
# NOTE: like the frame-wise prox run, the resulting encoder has a 1-channel
# sensor_embed. Loading it into a 4-channel downstream config leaves that
# projection randomly initialized (SLModule.load_encoder drops shape-mismatched
# keys silently) -- 776 of ~4M parameters, relearned during fine-tuning.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_tip_w15
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_tip_w15_prox

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_tip_w15_prox
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "fingertip", "w15", "proximity_only"]

data:
  sensor_channels: ["proximity"]

algorithm:
  encoder:
    frame_encoder:
      in_chans: 1
