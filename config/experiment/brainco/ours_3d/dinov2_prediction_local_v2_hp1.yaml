# @package _global_

# Hyperparameter variant 1 on top of dinov2_prediction_local_v2.
#
# Changes vs. the v2 baseline:
#   dino_head.out_dim   65536 -> 4096          (ImageNet-scale default was far
#                                               too large for this token count)
#   drop_path_rate      0.3   -> 0.0           (0.3 targets ViT-L/g, not 192-d tiny)
#   warmup_epochs       1     -> 10            (DINOv2 standard; 1/100 destabilises)
#   ibot_mask_ratio     [0.1,0.5] -> [0.3,0.7] (harder masked-token task)
#   window_stride       1     -> 3             (1/3 the windows; less redundancy)
#   window_size         6     -> 6             (unchanged, see below)
#   num_local_masks     8     -> 8             (unchanged, stated for the record)
#
# window_size stays 6 because AngleDINOv2PredictionModule requires
# window_size == 2 * context_window_size, so 3 is not expressible here. Context
# is frames 0-2, prediction target is frames 3-5. Keeping context_window_size 3
# also keeps encoder.sequence_length at 3, which the slip downstream
# (input_window_frames = 3) needs to stay divisible.

defaults:
  - /experiment/brainco/ours_3d/dinov2_prediction_local_v2
  - _self_

experiment_name: dinov2_prediction_local_all_pseudo_force_${model_size}_rope_v2_hp1

wandb:
  group: dino_prediction_local_all_pseudo_force_${model_size}_rope_v2_hp1
  tags: ["all", "pseudo_force", "4d", "${model_size}", "rope", "prediction",
         "local_view", "v2", "hp1"]

data:
  # Frames 0:3 are DINO/predictor context; frames 3:6 are prediction targets.
  window_size: 6
  # Stride 3 keeps every third window, cutting dataset size to ~1/3.
  window_stride: 3

algorithm:
  context_window_size: 3
  ibot_mask_ratio: [0.3, 0.7]
  num_local_masks: 8

  encoder:
    sequence_length: 3
    time_chunk_size: 3
    sensor_time_chunk_size: 1
    drop_path_rate: 0.0

  dino_head:
    out_dim: 4096

  lr_scheduler_cfg:
    warmup_epochs: 10
