# @package _global_
#
# BrainCo teleop pretraining, temporal former, 15-frame windows, INITIALISED
# FROM THE HOI-PRETRAINED CHECKPOINT.
#
# Identical to brainco_temporal_w15_scratch.yaml except for init_from_ckpt and
# init_skip_keys, so the pair isolates the effect of HOI pretraining on BrainCo
# SSL.
#
# The source run is temporal_w15_tip_lr4e4.yaml at epoch 500 -- OakInk-v2 +
# ARCTIC + TACO + HOT3D pseudo-force, 10 fingertips, proximity-only input, the
# best HOI arm measured so far (grasp 0.9333, slip 0.6919 BalAcc). Matching it
# fixes frame encoder depth 4 and frame_token_set: cls, and both arms of this
# pair follow it.
#
# The source is proximity-only (in_chans 1) while this run feeds 4 channels. That
# only matters for the tensors touching the channel axis, and both are handled:
# sensor_embed is re-initialised on purpose, and the (1,)-shaped signal_mean /
# signal_std buffers are skipped on the shape check -- the "shape mismatch" line
# in the log names exactly those two per encoder and is expected. Everything the
# transfer is actually for -- sensor_block, the frame encoder blocks, the temporal
# former, both DINO heads -- has no channel axis and loads.
#
# init_from_ckpt copies parameters only -- fresh optimizer, scheduler and epoch
# counter, unlike ckpt_path which resumes. Two deliberate exceptions:
#
#   sensor_embed  is left at random init (init_skip_keys). HOI pseudo-force is
#                 a physics estimate in newtons; BrainCo ships raw sensor counts
#                 off a different transducer. The input projection is the one
#                 place that difference is not shared, so it relearns from
#                 scratch while every block above it transfers.
#   signal_mean/  are overwritten by this run's own train-set statistics through
#   signal_std    _maybe_update_encoder_stats, the same load-then-update order
#                 SLModule.load_encoder uses downstream.
#
# Both arms use lr 4e-4. That is a large learning rate for a transfer run and
# will move the pretrained weights substantially; it is kept equal to the
# scratch arm so initialisation is the only difference. For a gentler transfer,
# override on the command line rather than editing this file:
#   python train.py +experiment=brainco/ours_3d/brainco_temporal_w15_hoi_init.yaml \
#       algorithm.optim_cfg.lr=1e-4
#
# Self-contained: no parent experiment config.

defaults:
  - override /data: brainco_temporal_pretraining
  - override /algorithm: temporal_dinov2
  - _self_

wandb:
  project: dinov2
  tags:
  - brainco
  - teleop
  - ${model_size}
  - rope
  - temporal_former
  - w15
  - force_cossin
  - fingertip
  - cls_frames
  - frame_d4
  - frame_dino
  - lr4e-4
  - hoi_init
  group: dino_temporal_brainco_${model_size}_w15_force_cossin

data:
  train_dataloader:
    batch_size: 2048

algorithm:
  # BraincoSSLDataset names its two streams "sensor" / "sensor_poses" where the
  # HOI dataset says "joint_force" / "finger_xyz". Same tensors, same channel
  # order, same units.
  sensor_input_key: sensor
  pos_input_key: sensor_poses
  encoder:
    frame_token_set: cls
    frame_encoder:
      in_dim: 10        # 10 fingertip sensors, left 0-4 then right 5-9
      in_chans: 4       # [Fn, Ft*cos, Ft*sin, proximity]
      pos_in_dim: 10
      pos_in_chans: 3   # fingertip XYZ
      depth: 4
  optim_cfg:
    lr: 0.0004
  frame_dino_loss_weight: 1.0
  frame_ibot_loss_weight: 1.0
  frame_dino_frames: 2
  frame_dino_num_local_masks: 4
  frame_dino_global_mask_scale:
  - 0.6
  - 1.0
  frame_dino_local_mask_scale:
  - 0.3
  - 0.6
  frame_dino_ibot_mask_ratio:
  - 0.3
  - 0.7

model_size: tiny
ckpt_path: ./
init_from_ckpt: ./experiments/dinov2_temporal_all_pseudo_force_tiny_tip_w15_prox_cls_d4_fe4_fdino_lr4e4/2026.07.29-17-47/checkpoints/epoch-0500.ckpt
# Relearn the force input projection from scratch; transfer everything above it.
init_skip_keys:
- sensor_embed.
experiment_name: dinov2_temporal_brainco_${model_size}_w15_force_cossin_hoi_init

# No validation split -- every episode trains -- so validation_frequency has
# nothing to run.
trainer:
  max_epochs: 1000
  checkpoint_frequency: 50
