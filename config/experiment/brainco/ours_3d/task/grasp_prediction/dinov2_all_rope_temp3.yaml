# @package _global_

defaults:
  - /experiment/brainco/ours_3d/task/grasp_prediction/dinov2_all_rope
  - _self_

experiment_name: brainco_xyz_grasp_prediction_all_rope_temp3_pretrained

wandb:
  group: all_pseudo_force_rope_temporal3_pretrained
  tags: ["brainco", "xyz", "grasp_prediction", "all", "pretrained", "rope", "temporal3", "window30", "mean10"]

data:
  # Keep the 30-frame grasp window. The three-frame temporal encoder is
  # applied to 10 consecutive chunks, then MeanPoolProbe averages 10 tokens.
  window_time: 0.3

task:
  checkpoint_encoder: ~ #${paths.encoder_checkpoint_root}/dinov2_xyz_temp/epoch-0050.ckpt
  train_encoder: true
  encoder_lr: 1e-5
  task_lr: 1e-4
  model_encoder:
    sequence_length: 3
    sensor_time_chunk_size: 1
    time_chunk_size: 3
    pre_fusion_depth: 1
