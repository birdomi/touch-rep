wandb:
  group: all_pseudo_force_rope_scratch_temporal_rope_probe
  tags: ["brainco", "xyz", "grasp_prediction", "all", "scratch", "rope", "causal_temporal_rope_probe"]

task:
  checkpoint_encoder: null
  train_encoder: true
