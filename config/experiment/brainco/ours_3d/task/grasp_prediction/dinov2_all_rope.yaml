# @package _global_

defaults:
  - override /data: brainco_xyz_grasp_prediction_combined
  - override /task: brainco_xyz_grasp_prediction
  - _self_

ssl_name: dinov2
sensor: brainco_xyz
experiment_name: brainco_xyz_grasp_prediction_all_rope_pretrained
ckpt_path: ./
resume_id: ~

fold: 0
num_folds: 4

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: brainco_xyz_grasp_prediction
  group: all_pseudo_force_rope_pretrained
  tags: ["brainco", "xyz", "grasp_prediction", "all", "pretrained", "rope"]

task:
  # Completed ours_3d pretraining_all run (50 epochs).
  # Override task.checkpoint_encoder on the CLI to sweep another checkpoint.
  # checkpoint_encoder: checkpoints/dinov2_xyz/epoch-0010.ckpt
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_xyz/epoch-0100.ckpt
  train_encoder: true
  encoder_lr: 1e-6
  task_lr: 1e-4
