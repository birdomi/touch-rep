# @package _global_

# Fine-tune the three-frame temporal DINO XYZ encoder on the three-frame,
# non-overlapping slip-detection windows.
defaults:
  - override /data: brainco_xyz_slip_detection
  - override /task: brainco_xyz_slip_detection
  - _self_

ssl_name: dinov2
sensor: brainco_xyz
experiment_name: brainco_xyz_slip_detection_all_rope_temp3_pretrained
ckpt_path: ./
resume_id: ~

fold: 0
num_folds: 5

wandb:
  entity: ryk9012-gwangju-institute-of-science-and-technology
  project: brainco_xyz_slip_detection
  group: all_pseudo_force_rope_temporal3_pretrained
  tags: ["brainco", "xyz", "slip_detection", "all", "pretrained", "rope", "temporal3"]

task:
  # Pretrained by ours_3d/dinov2_pretraining_all_rope_temp3.yaml.
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_xyz_temp/epoch-0100.ckpt
  train_encoder: true
  model_encoder:
    sequence_length: 3
    time_chunk_size: 3
