# @package _global_

# dinov2_temporal_w15_prox_cls_d4_fe4 plus a frame-level DINOv2 objective on
# the frame encoder's outputs, before the temporal former.
#
# Two DINOv2 objectives share one EMA teacher:
#   window level (existing): temporal crops -> former window-CLS DINO
#                            + frame-CLS span iBOT + KoLeo
#   frame level  (new):      sensor/pose-subset views of sampled single frames
#                            -> frame-CLS DINO + patch iBOT over both streams,
#                            through a separate frame_dino_head
#
# Why: with frame_token_set=cls all supervision funnels through the frame
# CLS bottleneck and the joint patch tokens get no direct loss; the frame
# branch restores per-joint supervision and trains the frame-CLS as a proper
# single-frame summary (the same token the former consumes).
#
# Both branches crop BOTH streams (sensor joints and finger poses) and mask
# tokens in both, as AngleDinov2Module does -- an uncropped pose stream lets
# the CLS match views from the hand configuration alone.
#
# Cost: 2 global + 4 local frame-encoder views over frame_dino_frames=2
# sampled frames per window, on top of the existing single full-window pass.
# Measured at equal batch: ~+47% wall clock per epoch (3.4 -> 5.0 min).
#
# Inherited unchanged: proximity-only (in_chans 1), 42 joints, CLS-frames
# former input, former depth 4, frame encoder depth 4, W=15, stride 5, lr,
# batch 2048.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_prox_cls_d4_fe4
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4_fdino

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4_fdino
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "proximity_only", "42joint", "cls_frames", "former_d4",
         "frame_d4", "frame_dino"]

# WARNING: the sibling baseline (dinov2_temporal_w15_prox_cls_d4_fe4) inherits
# max_epochs 100, so a head-to-head against it differs in epochs as well as in
# the frame-level objective. Run the baseline with
# trainer.max_epochs=500 before attributing any downstream gap to frame_dino.
trainer:
  max_epochs: 500

# Restates the value inherited from tip_w15 (which was raised 256 -> 2048 on
# 2026-07-29); pinned here so this run's batch does not move if that parent
# changes again. lr stays at 1e-4 -- unscaled, and at this batch the run takes
# 123k optimizer steps over 500 epochs vs the baseline's 197k over 100
# (504,837 train windows: 246 steps/epoch at 2048, 1972 at 256).
data:
  train_dataloader:
    batch_size: 2048

algorithm:
  frame_dino_loss_weight: 1.0
  frame_ibot_loss_weight: 1.0
  frame_dino_frames: 2
  frame_dino_num_local_masks: 4
  frame_dino_global_mask_scale: [0.6, 1.0]
  frame_dino_local_mask_scale: [0.3, 0.6]
  frame_dino_ibot_mask_ratio: [0.3, 0.7]
