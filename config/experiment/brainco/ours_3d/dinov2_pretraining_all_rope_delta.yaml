# @package _global_

# Single-frame pseudo-force/XYZ pretraining with force change channels.
# Sensor input order is the original four force channels followed by their
# differences from the preceding frame. At a sequence boundary delta is zero.
defaults:
  - /experiment/brainco/ours_3d/dinov2_pretraining_all_rope
  - _self_

experiment_name: dinov2_all_pseudo_force_${model_size}_rope_delta

wandb:
  group: dino_all_pseudo_force_${model_size}_rope_delta
  tags: ["all", "pseudo_force", "force_delta", "8d", "${model_size}", "rope"]

data:
  window_size: 1
  window_stride: 1
  include_force_delta: true

algorithm:
  encoder:
    in_chans: 8
    sequence_length: 1
    time_chunk_size: 1
