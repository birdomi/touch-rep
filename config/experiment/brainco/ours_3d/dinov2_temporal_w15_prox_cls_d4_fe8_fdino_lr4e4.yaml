# @package _global_

# dinov2_temporal_w15_prox_cls_d4_fe4_fdino_lr4e4 with the frame encoder back at
# depth 8. Only algorithm.encoder.frame_encoder.depth changes.
#
# The d4_fe4 line halved the frame encoder 8 -> 4 on the reasoning that with
# frame_token_set=cls it only has to summarize one frame into one token. This run
# tests that call directly, now that the fdino branch gives the frame encoder its
# own DINO/iBOT supervision -- the condition under which the extra depth is most
# likely to pay off.
#
# pre_fusion_depth stays 1 (set explicitly in config/algorithm/temporal_dinov2),
# so depth 8 doubles the fusion blocks and leaves the pre-fusion sensor stage
# alone.
#
# Companion: dinov2_temporal_tip_w15_prox_cls_d4_fe8_fdino_lr4e4 (fingertip).
# Comparison target: tip_lr4e4_ep500 / fdino_lr4e4_ep500 at frame depth 4.
#
# Downstream evals MUST set model_encoder.frame_encoder.depth: 8, or
# load_encoder silently drops the extra blocks.
#
# Inherited: proximity-only (in_chans 1), all 42 joints, CLS-frames former
# input, former depth 4, W=15, stride 5, batch 2048, lr 4e-4, 500 epochs,
# frame-level DINO/iBOT at weight 1.0/1.0.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_prox_cls_d4_fe4_fdino_lr4e4
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe8_fdino_lr4e4

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe8_fdino_lr4e4
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "proximity_only", "42joint", "cls_frames", "former_d4",
         "frame_d8", "frame_dino", "lr4e-4"]

algorithm:
  encoder:
    frame_encoder:
      depth: 8
