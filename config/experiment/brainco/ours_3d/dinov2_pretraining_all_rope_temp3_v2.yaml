# @package _global_

# Three-frame pseudo-force/XYZ temporal patches. Each joint and fingertip is
# projected from its three consecutive frames into one 192-D token.
defaults:
  - /experiment/brainco/ours_3d/dinov2_pretraining_all_rope
  - _self_

experiment_name: dinov2_all_pseudo_force_${model_size}_rope_temporal3_v2

wandb:
  group: dino_all_pseudo_force_${model_size}_rope_temporal3_v2
  tags: ["all", "pseudo_force", "4d", "${model_size}", "rope", "temporal3"]

data:
  # Produces fully overlapping 3-frame windows (stride 1).
  window_size: 3
  window_stride: 1
  sensor: all_pseudo_force
  oakinkv2_data_root: ./pretraining_dataset/pseudo_force_dataset_v2/oakinkv2
  arctic_data_root: ./pretraining_dataset/pseudo_force_dataset_v2/arctic
  taco_data_root: ./pretraining_dataset/pseudo_force_dataset_v2/taco
  hot3d_data_root: ./pretraining_dataset/pseudo_force_dataset_v2/hot3d

algorithm:
  encoder:
    # Sensor: kernel/stride=1 -> (B, 3*42, 192).
    # XYZ: kernel/stride=3 -> (B, 10, 192).
    sequence_length: 3
    sensor_time_chunk_size: 1
    time_chunk_size: 3
    pre_fusion_depth: 1
