# @package _global_

# Fingertip-only pretraining: the sensor stream is the 10 fingertip joints
# (FINGERTIP_COLUMNS) instead of all 42 hand joints.
#
# Motivation: the BrainCo downstream tasks sense exactly these 10 fingertips.
# With 42-joint pretraining the downstream encoder maps its 10 sensors onto a
# skeleton whose other 32 token positions it has never used at fine-tuning
# time. Fingertip-only pretraining makes the pretraining and downstream token
# sets identical -- same 10 tokens, same skeleton RoPE coordinates via
# _sparse_tactile_coords() (the n==10 branch the downstream already takes).
# Under RoPE no weight shape depends on in_dim, so checkpoints stay loadable
# by the existing downstream pipeline unchanged.
#
# Also concentrates the masked-token objectives: with 42 joints most tokens
# are non-fingertip joints whose pseudo-force is rarely in contact; fingertip
# tokens are where the contact signal lives.
#
# Built on the ibotfix control (post iBOT-indexing-fix, stride 3), so its
# matched comparison partner is dinov2_pretraining_all_rope_v2_hp1_ibotfix.

defaults:
  - /experiment/brainco/ours_3d/dinov2_pretraining_all_rope_v2_hp1_ibotfix
  - _self_

experiment_name: dinov2_all_pseudo_force_${model_size}_rope_v2_hp1_ibotfix_tip

wandb:
  group: dino_all_pseudo_force_${model_size}_rope_v2_hp1_ibotfix_tip
  tags: ["all", "pseudo_force", "4d", "${model_size}", "rope", "v2", "hp1",
         "ibotfix", "fingertip"]

data:
  fingertip_only: true

algorithm:
  encoder:
    # 10 fingertip tokens; RoPE keeps the same skeleton coordinates as 42-joint
    # pretraining, selected via the sparse-tactile branch.
    in_dim: 10
