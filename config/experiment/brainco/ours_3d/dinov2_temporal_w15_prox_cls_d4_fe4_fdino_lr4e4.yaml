# @package _global_

# dinov2_temporal_w15_prox_cls_d4_fe4_fdino at lr 4e-4 (4x the inherited 1e-4).
#
# The batch went 256 -> 2048 with no lr change; linear scaling would suggest
# 8e-4 and sqrt scaling ~2.8e-4, so 4e-4 sits between the two rules. At this
# batch the run is 123k optimizer steps over 500 epochs (246 per epoch).
#
# start_lr stays 1e-5, so warmup now climbs from 2.5% of peak instead of 10%
# over the same 10 epochs -- a gentler start, which is the safe direction.
#
# Separate experiment_name on purpose: the lr 1e-4 fdino run predates the
# pose-crop and cross-view fixes in temporal_dinov2.py, so it is not a
# controlled comparison for this one either way.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_prox_cls_d4_fe4_fdino
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4_fdino_lr4e4

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_w15_prox_cls_d4_fe4_fdino_lr4e4
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "proximity_only", "42joint", "cls_frames", "former_d4",
         "frame_d4", "frame_dino", "lr4e-4"]

algorithm:
  optim_cfg:
    lr: 4e-4
