# @package _global_

# dinov2_temporal_w15_prox_cls_d4_fe4_fdino_lr4e4 restricted to the 10 fingertip
# sensors: the frame encoder's sensor stream is FINGERTIP_COLUMNS instead of all
# 42 skeleton joints. Channels are unchanged -- still proximity only (in_chans
# 1) -- so this isolates the spatial extent of the sensor input.
#
# The frame encoder now emits 10 sensor + 10 pos tokens per frame instead of
# 42 + 10, and its RoPE takes the sparse-tactile branch (n == 10 ==
# len(TACTILE_SENSOR_IDXS)) rather than the full-skeleton one. Downstream
# BrainCo feeds exactly these 10 fingertip sensors, so the pretraining and
# fine-tuning layouts match directly instead of going through the sparse
# mapping.
#
# Everything else is inherited: frame-level DINO/iBOT branch (weights 1.0/1.0,
# both streams cropped), former depth 4, frame encoder depth 4, CLS-frames
# former input, W=15, stride 5, batch 2048, lr 4e-4, 500 epochs.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_prox_cls_d4_fe4_fdino_lr4e4
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_tip_w15_prox_cls_d4_fe4_fdino_lr4e4

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_tip_w15_prox_cls_d4_fe4_fdino_lr4e4
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "proximity_only", "fingertip", "cls_frames", "former_d4",
         "frame_d4", "frame_dino", "lr4e-4"]

data:
  fingertip_only: true

algorithm:
  encoder:
    frame_encoder:
      in_dim: 10
