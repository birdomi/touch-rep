# @package _global_

# The joint-only run at window_stride 30 instead of the inherited 5.
#
# W=15 with stride 30 means consecutive windows are disjoint AND separated by a
# 15-frame gap -- every frame appears in at most one window, versus three
# windows at stride 5. The window count drops roughly 6x, so at the inherited
# batch 2048 an epoch is ~41 optimizer steps instead of 246.
#
# WARNING: max_epochs is inherited at 500, so this run takes ~20k optimizer
# steps where the stride-5 sibling takes ~123k. A downstream gap against the
# stride-5 joint-only run is therefore a stride AND a training-length
# difference, not stride alone. For step parity, run with
# trainer.max_epochs=3000.
#
# Everything else is inherited: frame encoder input_streams=pos (no force or
# proximity token ever enters the network), 42-joint pose layout, CLS-frames
# former input, former depth 4, frame encoder depth 4, W=15, batch 2048,
# lr 4e-4.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_w15_jointonly_cls_d4_fe4_fdino_lr4e4
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_w15_jointonly_cls_d4_fe4_fdino_lr4e4_s30

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_w15_jointonly_cls_d4_fe4_fdino_lr4e4_s30
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "w15", "joint_only", "no_force", "42joint", "cls_frames", "former_d4",
         "frame_d4", "frame_dino", "lr4e-4", "stride30"]

data:
  window_stride: 30
