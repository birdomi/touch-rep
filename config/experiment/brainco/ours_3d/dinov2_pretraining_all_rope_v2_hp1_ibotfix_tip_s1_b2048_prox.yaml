# @package _global_

# Proximity-only ablation of dinov2_pretraining_all_rope_v2_hp1_ibotfix_tip_s1_b2048:
# the sensor stream keeps just the proximity channel of the 10 fingertips
# (in_chans 1 instead of 4). Everything else -- fingertip tokens, stride 1,
# batch 2048, lr 1e-4, 100 epochs -- is inherited unchanged.
#
# Question this answers: how much of the pretrained representation's value
# comes from contactless geometry (proximity) alone, without any force
# magnitude or direction?

defaults:
  - /experiment/brainco/ours_3d/dinov2_pretraining_all_rope_v2_hp1_ibotfix_tip_s1_b2048
  - _self_

experiment_name: dinov2_all_pseudo_force_${model_size}_rope_v2_hp1_ibotfix_tip_s1_b2048_prox

wandb:
  group: dino_all_pseudo_force_${model_size}_rope_v2_hp1_ibotfix_tip_s1_b2048_prox
  tags: ["all", "pseudo_force", "${model_size}", "rope", "v2", "hp1",
         "ibotfix", "fingertip", "stride1", "b2048", "proximity_only"]

data:
  sensor_channels: ["proximity"]

algorithm:
  encoder:
    in_chans: 1
