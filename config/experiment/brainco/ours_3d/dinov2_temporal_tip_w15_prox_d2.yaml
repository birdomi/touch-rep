# @package _global_

# dinov2_temporal_tip_w15_prox with a depth-2 temporal former (was 4).
#
# Motivation: w15_prox + CLS readout is the current slip best (F1 macro 0.7129
# vs 0.6697 with the attentive pooler, seed 0). A shallower former tests
# whether that summary survives with half the temporal capacity -- and the w5
# result (short spans competitive on slip) hints that less temporal machinery
# may even help.
#
# Everything else -- proximity-only input, W=15, crop ranges, batch 2048,
# stride 5, lr, 100 epochs -- is inherited unchanged.
#
# NOTE for downstream evals: the task config must set model_encoder.depth: 2
# to match, otherwise SLModule.load_encoder drops the former blocks silently.

defaults:
  - /experiment/brainco/ours_3d/dinov2_temporal_tip_w15_prox
  - _self_

experiment_name: dinov2_temporal_all_pseudo_force_${model_size}_tip_w15_prox_d2

wandb:
  group: dino_temporal_all_pseudo_force_${model_size}_tip_w15_prox_d2
  tags: ["all", "pseudo_force", "${model_size}", "rope", "temporal_former",
         "fingertip", "w15", "proximity_only", "depth2"]

algorithm:
  encoder:
    depth: 2
