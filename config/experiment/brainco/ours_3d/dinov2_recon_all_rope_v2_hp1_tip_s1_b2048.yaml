# @package _global_

# Fingertip-only, window_stride 1, batch 2048, plus the force reconstruction
# objective. Matched partner of
# dinov2_pretraining_all_rope_v2_hp1_ibotfix_tip_s1_b2048 (GPU0): the two
# differ only by the reconstruction settings below, mirroring the earlier
# base/recon pairs.
#
# Reconstruction settings match dinov2_recon_all_rope_v2_hp1 (weight 4.0,
# visible token set, smooth_l1, linear head). With fingertip_only the head
# reconstructs the 10 fingertip force vectors -- the contact-dense tokens --
# rather than mostly-idle interior joints.

defaults:
  - /experiment/brainco/ours_3d/dinov2_pretraining_all_rope_v2_hp1_ibotfix_tip_s1_b2048
  - _self_

experiment_name: dinov2_recon_all_pseudo_force_${model_size}_rope_v2_hp1_tip_s1_b2048

wandb:
  group: dino_recon_all_pseudo_force_${model_size}_rope_v2_hp1_tip_s1_b2048
  tags: ["all", "pseudo_force", "4d", "${model_size}", "rope", "v2", "hp1",
         "ibotfix", "fingertip", "stride1", "b2048", "reconstruction"]

algorithm:
  _target_: tactile_ssl.algorithm.AngleDINOv2ReconstructionModule
  reconstruction_loss_weight: 4.0
  reconstruction_loss_type: smooth_l1
  reconstruction_token_set: visible
  reconstruction_hidden_dim: null
  reconstruction_contact_weight: 0.0
