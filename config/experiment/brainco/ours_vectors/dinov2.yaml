# @package _global_

defaults:
  - override /data: brainco_xela_multi
  - override /algorithm: angle_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_multi_sensor_ours_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: brainco_dinov2
  group: dino_multi_sensor_ours_${model_size}
  tags: ["multi_sensor", "brainco", "${model_size}", "conv1d", "T50", "ours"]

trainer:
  max_epochs: 1000
  validation_frequency: 50

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.angle_tiny
    in_dim: 42              # 21 lh + 21 rh joints (contact stream)
    in_chans: 1             # contact channel
    pos_in_dim: 10          # 5 lh + 5 rh fingers (angle stream)
    pos_in_chans: 4         # angle values per finger
    sequence_length: 3
    time_chunk_size: 3
    num_register_tokens: 1
    pos_embed_fn: learned
    with_masktoken: True
    drop_path_rate: 0.3
    drop_path_uniform: True
    normalization: ${data.normalization}
    causal: False
