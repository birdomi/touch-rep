# @package _global_
defaults:
  - override /data: brainco_grasp_prediction
  - override /task: multi_sensor_grasp_prediction
  - _self_

ssl_name: dinov2
sensor: brainco
experiment_name: grasp_prediction_multi_sensor_cat_temporal
ckpt_path: ./

resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

fold: 0       # 0-indexed fold to use as validation set
num_folds: 5  # 5-fold → 80% train / 20% val by episode

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_multi_sensor_brainco_tiny/epoch-0300.ckpt
  train_encoder: true

  model_encoder:
    _target_: tactile_ssl.model.multi_sensor_brainco_cat_temporal_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 5    # T=5: 5 consecutive frames processed jointly per encoder call
    time_chunk_size: 1
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: False
    drop_path_rate: 0.0
    causal: False
    xela_num_frames: 10
