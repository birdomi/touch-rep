# @package _global_
defaults:
  - override /data: brainco_grasp_prediction_vision
  - override /task: brainco_grasp_prediction
  - _self_

sensor: brainco
experiment_name: grasp_prediction_resnet18
ckpt_path: ./
resume_id: ~

ssl_name: resnet18
checkpoint_encoder: ~

fold: 0
num_folds: 5

pretrained: true
freeze_backbone: false
use_scheduler: true
lr: 3e-4
weight_decay: 1e-4

train_data_budget: 1.0
val_data_budget: 1.0
