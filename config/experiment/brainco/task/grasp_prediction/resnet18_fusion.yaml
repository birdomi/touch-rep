# @package _global_
defaults:
  - override /data: brainco_grasp_prediction_multimodal
  - override /task: brainco_grasp_prediction
  - _self_

ssl_name: dinov2
sensor: brainco
experiment_name: grasp_prediction_resnet18_fusion
ckpt_path: ./
resume_id: ~

fold: 0
num_folds: 5

train_data_budget: 1.0
val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.BraincoGraspFusionSLModule
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_brainco_tiny/epoch-0300.ckpt
  checkpoint_task: ~
  train_encoder: false
  pretrained_vision: true
  freeze_vision: false

  model_encoder:
    _target_: tactile_ssl.model.brainco_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 1
    time_chunk_size: 1
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: False
    drop_path_rate: 0.0
    causal: False
