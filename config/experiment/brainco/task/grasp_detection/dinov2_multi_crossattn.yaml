# @package _global_
defaults:
  - override /data: brainco_grasp
  - override /task: multi_sensor_grasp_detection
  - _self_

ssl_name: dinov2
sensor: brainco
experiment_name: grasp_detection_multi_sensor_crossattn
ckpt_path: ./

resume_id: ~
train_data_budget: 1.0
val_data_budget: 1.0

fold: 0       # 0-indexed fold to use as validation set
num_folds: 5  # 5-fold → 80% train / 20% val by episode

task:
  checkpoint_encoder: ${paths.encoder_checkpoint_root}/dinov2_multi_sensor_crossattn_tiny/epoch-0300.ckpt

  model_encoder:
    _target_: tactile_ssl.model.multi_sensor_brainco_crossattn_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 1
    time_chunk_size: 1
    xela_num_frames: 10
    num_crossattn_layers: 4
