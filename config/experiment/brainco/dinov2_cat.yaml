# @package _global_
defaults:
  - override /data: brainco
  - override /algorithm: brainco_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_brainco_concat_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: brainco_dinov2
  group: dino_brainco${model_size}
  tags: ["brainco${model_size}"]

trainer:
  max_epochs: 5000
  validation_frequency: 50

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.brainco_cat_${model_size}
    in_chans: 10 # (3d force + 1d approximation) + (6D wrist position)

  online_probes:
    - _target_: tactile_ssl.probe.OnlineProbeModule
      probe_name: "reconstruction"
      decoder:
        _target_: tactile_ssl.probe.reconstruction.SignalDecoderBase
        in_dim: ${algorithm.encoder.in_dim}
        in_chans: 4
        sequence_length: ${algorithm.encoder.sequence_length}
        time_chunk_size: ${algorithm.encoder.time_chunk_size}
        input_embed_dim: ${model_embed_dim}
        embed_dim: 192
        depth: 4
      loss_fn:
        _target_: torch.nn.MSELoss