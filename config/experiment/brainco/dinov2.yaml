# @package _global_
defaults:
  - override /data: brainco
  - override /algorithm: brainco_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_brainco_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: brainco_dinov2
  group: dino_brainco${model_size}
