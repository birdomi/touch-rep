# @package _global_
defaults:
  - override /data: cross_sensor
  - override /algorithm: cross_sensor_dinov2
  - _self_

model_size: tiny
experiment_name: dinov2_cross_sensor_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: cross_sensor_dinov2
  group: dino_xela${model_size}
  tags: ["xela${model_size}"]

trainer:
  max_epochs: 100
  validation_frequency: 5

algorithm:
  centering: centering
  encoder:
    _target_: tactile_ssl.model.cross_sensor_${model_size}
