num_sensor: 2
model_size: tiny
experiment_name: dinov2_cross_sensor_align_${model_size}
ckpt_path: ./

wandb:
  entity: ryk012
  project: cross_sensor_dinov2
  group: dino_xela${model_size}
  tags: ["xela${model_size}"]

