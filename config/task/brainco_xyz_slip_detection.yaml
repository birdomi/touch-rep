# @package _global_

task_name: slip_detection
ssl_model_size: tiny
experiment_name: xyz_${task_name}
seed: 42
# Kept separate from the training RNG so multi-seed runs use identical
# episode-level folds unless explicitly requested otherwise.
split_seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/brainco_xyz_slip_detection/${hydra.job.id}_${experiment_name}

wandb:
  project: brainco_xyz_slip_detection
  group: ~
  tags: ["brainco", "xyz", "slip_detection"]

trainer:
  max_epochs: 100
  validation_frequency: 5
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: log
  max_task_checkpoints: 10
  save_probe_weights_only: true

data:
  train_data_budget: 1.0
  val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.BraincoAngleGraspSLModule
  checkpoint_task: ~

  # Identical tactile/XYZ token layout to ours_3d pretraining.
  model_encoder:
    _target_: tactile_ssl.model.angle_tiny
    in_dim: 42
    in_chans: 4
    pos_in_dim: 10
    pos_in_chans: 3
    sequence_length: 1
    sensor_time_chunk_size: 1
    time_chunk_size: 1
    num_register_tokens: 1
    pos_embed_fn: rope
    with_masktoken: true
    use_null_token: true
    drop_path_rate: 0.3
    drop_path_uniform: true
    normalization: ~
    causal: false
    rope_hand_offset: 10
    debug_rope: false
    pre_fusion_depth: 1

  model_task:
    _target_: tactile_ssl.downstream_task.MeanPoolProbe
    embed_dim: 192
    num_classes: 2

  checkpoint_encoder: ~
  train_encoder: true
  encoder_type: dinov2
  encoder_warmup_fine_tune_sensor_epochs: 0
  encoder_warmup_fine_tune_sensor_shallow_blocks: ~
  log_confusion_matrix_image: false
  best_val_metric: f1

  optim_cfg:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 1e-5

  scheduler_cfg: ~
