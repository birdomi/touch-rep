#@package _global_

task_name: grasp_detection
ssl_model_size: tiny
experiment_name: ${sensor}_${task_name}_multi_sensor
seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/grasp_detection/${hydra.job.id}_${experiment_name}

wandb:
  project: brainco_grasp_detection
  group: ~
  tags: ["brainco", "grasp_detection", "multi_sensor"]

trainer:
  max_epochs: 100
  validation_frequency: 5
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: "log"
  max_task_checkpoints: 10
  save_probe_weights_only: true

data:
  train_data_budget: 1.0
  val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.MultiSensorGraspDetectionSLModule
  checkpoint_task: ~
  xela_num_frames: 10

  model_encoder:
    _target_: tactile_ssl.model.multi_sensor_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 3
    time_chunk_size: 3
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: false
    drop_path_rate: 0.0
    causal: False

  model_task:
    _target_: tactile_ssl.downstream_task.AttentiveClassifier
    embed_dim: 192
    num_heads: 3
    mlp_ratio: 4.0
    depth: 1
    num_classes: 2
    complete_block: True

  checkpoint_encoder: ${checkpoint_encoder}
  train_encoder: false
  encoder_type: ${ssl_name}

  finetune_modules:
    - sensor_block

  optim_cfg:
    _partial_: True
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 5e-4

  # scheduler_cfg:
  #   _partial_: True
  #   _target_: tactile_ssl.model.custom_scheduler.CosineScheduler
  #   start_lr: 1e-4
  #   final_lr: 1e-6
