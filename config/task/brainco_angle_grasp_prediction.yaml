#@package _global_

task_name: grasp_prediction
ssl_model_size: tiny
experiment_name: angle_${task_name}
seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/angle_grasp_prediction/${hydra.job.id}_${experiment_name}

wandb:
  project: brainco_angle_grasp_prediction
  group: ~
  tags: ["brainco", "angle", "grasp_prediction"]

trainer:
  max_epochs: 100
  validation_frequency: 5
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: "log"
  max_task_checkpoints: 10
  save_probe_weights_only: true

data:
  train_data_budget: 1.0
  val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.BraincoAngleGraspSLModule
  checkpoint_task: ~

  model_encoder:
    _target_: tactile_ssl.model.angle_tiny
    in_dim: 10          # N_sensors: 5 lh + 5 rh (contact stream)
    in_chans: 4         # 4-channel tactile
    pos_in_dim: 10      # N_fingers: 5 lh + 5 rh (angle stream)
    pos_in_chans: 4     # [abduction, MCP, PIP, DIP]
    sequence_length: 1
    time_chunk_size: 1
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: False
    drop_path_rate: 0.0
    causal: False

  model_task:
    _target_: tactile_ssl.downstream_task.MeanPoolProbe
    embed_dim: 192
    num_heads: 3
    mlp_ratio: 4.0
    depth: 2
    num_classes: 2

  checkpoint_encoder: ~
  train_encoder: true
  encoder_type: dinov2
  encoder_warmup_fine_tune_sensor_epochs: 0
  encoder_warmup_fine_tune_sensor_shallow_blocks: ~

  optim_cfg:
    _partial_: True
    _target_: torch.optim.AdamW
    lr: 1e-5
    weight_decay: 1e-6

  # scheduler_cfg:
  #   _partial_: True
  #   _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
  #   warmup_epochs: 0
  #   start_lr: 1e-4
  #   final_lr: 1e-6
