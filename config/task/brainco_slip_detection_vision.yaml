# @package _global_

task_name: slip_detection
experiment_name: vision_${task_name}
seed: 42
# Kept separate from the training RNG so multi-seed runs use identical
# episode-level folds unless explicitly requested otherwise.
split_seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/brainco_slip_detection_vision/${hydra.job.id}_${experiment_name}

wandb:
  project: brainco_xyz_slip_detection
  group: ~
  tags: ["brainco", "vision", "resnet18", "slip_detection"]

trainer:
  max_epochs: 50
  validation_frequency: 5
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: log
  max_task_checkpoints: 1
  # The ResNet has no `model_task` submodule, so probe-only saving would write
  # an empty state dict.
  save_probe_weights_only: false

data:
  train_data_budget: 1.0
  val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.ResNet18SlipModule

  pretrained: true
  freeze_backbone: false
  num_classes: 2

  # "mean" pools frame features (order-agnostic); "concat" keeps the temporal
  # order explicit; "diff" adds the last-minus-first feature difference.
  frame_aggregation: concat
  num_input_frames: ${data.num_frames_per_sample}
  dropout: 0.0

  # null = unweighted loss (the equal-class train sampler already balances).
  class_weights: null
  best_val_metric: balanced_accuracy
  val_average_epochs: [10, 20, 30, 40, 50]
  log_confusion_matrix_image: false

  optim_cfg:
    _partial_: true
    _target_: torch.optim.AdamW
    lr: 3e-4
    weight_decay: 1e-4

  scheduler_cfg:
    _partial_: true
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.max_epochs}
