#@package _global_

task_name: grasp_prediction
ssl_model_size: tiny
experiment_name: ${sensor}_${task_name}
seed: 42

hydra:
  job:
    id: ${now:%Y.%m.%d}_${now:%H-%M}
  run:
    dir: ${paths.log_dir}/grasp_prediction/${hydra.job.id}_${experiment_name}

wandb:
  project: brainco_grasp_prediction
  group: ~
  tags: ["brainco", "grasp_prediction"]

trainer:
  max_epochs: 100
  validation_frequency: 5
  sanity_validate: true
  save_checkpoint_dir: ${paths.output_dir}/checkpoints
  checkpoint_interval_type: "log"
  max_task_checkpoints: 10
  save_probe_weights_only: true

data:
  train_data_budget: 1.0
  val_data_budget: 1.0

task:
  _target_: tactile_ssl.downstream_task.BraincoGraspDetectionSLModule
  checkpoint_task: ~

  model_encoder:
    _target_: tactile_ssl.model.brainco_tiny
    in_dim: 10
    in_chans: 4
    sequence_length: 1
    time_chunk_size: 1
    pos_embed_fn: learned
    num_register_tokens: 1
    with_masktoken: False
    drop_path_rate: 0.0
    causal: False

  model_task:
    _target_: tactile_ssl.downstream_task.AttentiveClassifier
    embed_dim: 192
    num_heads: 3
    mlp_ratio: 4.0
    depth: 1
    num_classes: 2
    complete_block: True

  checkpoint_encoder: ${checkpoint_encoder}
  train_encoder: false
  encoder_type: ${ssl_name}
  lora_rank: 0          # 0 = disabled; e.g. 8 to enable LoRA
  lora_alpha: 1.0       # scale = lora_alpha / lora_rank
  lora_dropout: 0.0
  lora_target_modules: ["qkv", "proj"]

  optim_cfg:
    _partial_: True
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 1e-2

  scheduler_cfg:
    _partial_: True
    _target_: tactile_ssl.model.custom_scheduler.WarmupCosineScheduler
    warmup_epochs: 0
    start_lr: 1e-4
    final_lr: 1e-6
